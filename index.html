<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>VIP Premium Ticket Game</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
  radial-gradient(circle at top,#312e81,#080914 55%);
  overflow-x:hidden;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

/* TELEGRAM */

.telegram-banner{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px;
  margin-bottom:15px;
  border-radius:18px;
  background:linear-gradient(135deg,#075985,#229ed9,#0c4a6e);
  border:2px solid #67e8f9;
  box-shadow:0 0 25px #229ed9;
}

.telegram-icon{font-size:32px}
.telegram-text{flex:1}

.join-title{
  font-size:16px;
  font-weight:bold;
}

.join-subtitle{
  font-size:11px;
  color:#e0f2fe;
  margin-top:5px;
}

.join-button{
  text-decoration:none;
  background:white;
  color:#075985;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
  font-size:12px;
}

/* TELEGRAM PAYMENT MESSAGE */

.telegram-note{
  text-align:center;
  margin-top:10px;
  color:#fde68a;
  font-size:12px;
  font-weight:bold;
}

/* HEADER */

.header{
  text-align:center;
  padding:25px 15px;
  border-radius:22px;
  background:linear-gradient(135deg,#111827,#312e81,#581c87);
  box-shadow:0 0 35px rgba(124,58,237,.5);
}

.header h1{
  color:#ffd700;
  font-size:29px;
  text-shadow:0 0 10px gold,0 0 25px #f59e0b;
}

.header p{
  margin-top:8px;
  color:#cbd5e1;
}

/* START BUTTON */

.start-game{
  display:block;
  margin:20px auto;
  padding:15px 35px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#ffd700,#f59e0b);
  color:#111;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 15px gold,0 0 35px rgba(255,215,0,.5);
}

.start-game:disabled{
  opacity:.5;
}

/* TIMER ROW */

.timer-ticket-row{
  display:flex;
  align-items:stretch;
  justify-content:center;
  gap:20px;
  margin-top:20px;
}

/* TIMER */

.timer-box{
  display:none;
  flex:1;
  max-width:430px;
  text-align:center;
  padding:25px;
  border-radius:22px;
  background:linear-gradient(135deg,#111827,#172554);
  border:2px solid #6366f1;
  box-shadow:0 0 25px rgba(99,102,241,.5);
}

.timer-title{
  font-size:14px;
  color:#cbd5e1;
  letter-spacing:2px;
  font-weight:bold;
}

.timer{
  margin-top:12px;
  font-size:72px;
  font-weight:900;
  letter-spacing:8px;
  color:#fff;
  padding:8px 20px;
  border-radius:18px;
  background:linear-gradient(135deg,#ff004c,#7c3aed,#00eaff);
  background-size:300% 300%;
  animation:timerGradient 3s ease infinite,timerPulse 1s infinite alternate;
  text-shadow:0 0 5px white,0 0 15px #00eaff,0 0 30px #ff00cc,0 0 50px gold;
  box-shadow:0 0 15px #00eaff,0 0 35px #ff00cc,0 0 60px gold;
}

@keyframes timerGradient{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

@keyframes timerPulse{
  from{transform:scale(1);filter:brightness(1)}
  to{transform:scale(1.05);filter:brightness(1.7)}
}

.timer.warning{
  animation:timerWarning .5s infinite alternate;
}

@keyframes timerWarning{
  from{transform:scale(1)}
  to{transform:scale(1.12);filter:brightness(2)}
}

/* WINNING BOX */

.winning-box{
  display:none;
  flex:1;
  max-width:430px;
  min-height:180px;
  padding:20px;
  text-align:center;
  border-radius:22px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#1e1b4b,#581c87,#075985);
  border:3px solid gold;
  box-shadow:0 0 15px gold,0 0 35px #ff00cc,0 0 60px #00eaff;
}

.winning-box:before{
  content:"";
  position:absolute;
  inset:-100%;
  background:conic-gradient(transparent,#ff00cc,#00eaff,gold,transparent);
  animation:rotateBox 2s linear infinite;
  opacity:.35;
}

@keyframes rotateBox{
  to{transform:rotate(360deg)}
}

.winning-content{
  position:relative;
  z-index:2;
}

.winning-label{
  color:#fde047;
  font-size:14px;
  font-weight:bold;
}

.winning-number{
  margin:12px 0;
  font-size:48px;
  font-weight:900;
  letter-spacing:4px;
  color:white;
  text-shadow:0 0 8px white,0 0 20px #00eaff,0 0 35px #ff00cc,0 0 50px gold;
}

.winning-amount{
  font-size:24px;
  font-weight:bold;
  color:#86efac;
  text-shadow:0 0 10px #22c55e,0 0 25px gold;
}

/* STATUS */

.status{
  display:none;
  text-align:center;
  margin-top:15px;
  padding:12px;
  border-radius:12px;
  background:#111827;
  color:#facc15;
}

/* TICKET AREA */

.ticket-area{
  margin-top:20px;
}

.tickets{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

/* TICKET */

.ticket{
  position:relative;
  padding:14px 8px;
  text-align:center;
  border-radius:16px;
  background:linear-gradient(135deg,#111827,#312e81);
  border:1px solid rgba(255,215,0,.6);
  box-shadow:0 7px 20px rgba(0,0,0,.5);
  animation:ticketAppear .5s ease;
}

@keyframes ticketAppear{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

.ticket-icon{
  font-size:32px;
  margin:7px 0;
}

.ticket-number{
  color:#ffd700;
  font-size:22px;
  font-weight:bold;
}

.ticket-amount{
  margin-top:7px;
  color:#86efac;
  font-size:13px;
  font-weight:bold;
}

.tickets.hide{
  animation:hideTickets .8s forwards;
}

@keyframes hideTickets{
  0%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(.2);visibility:hidden}
}

/* RESULT */

.result{
  display:none;
  margin-top:25px;
  padding:30px;
  text-align:center;
  border-radius:25px;
  background:radial-gradient(circle,#312e81,#111827 65%);
  border:3px solid gold;
  box-shadow:0 0 20px gold,0 0 50px #7c3aed,0 0 100px #06b6d4;
  animation:resultAppear 1s ease;
}

@keyframes resultAppear{
  from{transform:scale(.2);opacity:0}
  to{transform:scale(1);opacity:1}
}

.result-title{
  font-size:24px;
  color:#ffd700;
  margin-bottom:20px;
  text-shadow:0 0 10px gold,0 0 30px orange;
}

.result-number{
  font-size:70px;
  font-weight:900;
  color:white;
  text-shadow:0 0 10px white,0 0 25px #00eaff,0 0 50px #ff00cc,0 0 80px gold;
}

.result-amount{
  margin-top:12px;
  font-size:30px;
  color:#86efac;
  font-weight:bold;
}

/* NEXT */

.next-round{
  display:none;
  margin:25px auto;
  padding:13px 25px;
  border:0;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:600px){

  .telegram-banner{
    padding:11px;
  }

  .join-title{
    font-size:12px;
  }

  .join-subtitle{
    font-size:8px;
  }

  .join-button{
    padding:8px;
    font-size:10px;
  }

  .header h1{
    font-size:23px;
  }

  .timer-ticket-row{
    flex-direction:column;
  }

  .timer-box,
  .winning-box{
    width:100%;
    max-width:none;
  }

  .timer{
    font-size:55px;
  }

  .tickets{
    grid-template-columns:repeat(2,1fr);
  }

  .result-number{
    font-size:55px;
  }

  .result-amount{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- TELEGRAM -->

<div class="telegram-banner">

  <div class="telegram-icon">✈️</div>

  <div class="telegram-text">

    <div class="join-title">
      🔥 JOIN VIP TELEGRAM 🔥
    </div>

    <div class="join-subtitle">
      Latest Updates & Entertainment
    </div>

  </div>

  <a
    href="https://t.me/+tR2_XR-9ju05M2M9"
    target="_blank"
    class="join-button">
    JOIN NOW
  </a>

</div>

<div class="telegram-note">
  📩 Ticket Number Telegram पर भेजें — Virtual Demo Rewards
</div>

<!-- HEADER -->

<div class="header">

  <h1>🎟️ VIP PREMIUM TICKET GAME</h1>

  <p>Virtual Entertainment Experience</p>

</div>

<!-- START -->

<button
  id="startGame"
  class="start-game"
  onclick="startGame()">
  ⚡ START GAME
</button>

<!-- TIMER + WINNING BOX -->

<div class="timer-ticket-row">

  <div
    id="timerBox"
    class="timer-box">

    <div class="timer-title">
      ⚡ NEXT RESULT IN ⚡
    </div>

    <div
      id="timer"
      class="timer">
      60
    </div>

  </div>

  <!-- EMPTY UNTIL TIMER ENDS -->

  <div
    id="winningBox"
    class="winning-box">

    <div class="winning-content">

      <div class="winning-label">
        🏆 WINNING TICKET
      </div>

      <div
        id="winningNumber"
        class="winning-number">
        #---
      </div>

      <div
        id="winningAmount"
        class="winning-amount">
        ₹---
      </div>

    </div>

  </div>

</div>

<!-- STATUS -->

<div
  id="status"
  class="status">
  🎮 Game Running...
</div>

<!-- TICKETS -->

<div
  id="ticketArea"
  class="ticket-area">

  <div
    id="tickets"
    class="tickets">
  </div>

</div>

<!-- RESULT -->

<div
  id="result"
  class="result">

  <div class="result-title">
    ⚡🎉 WINNER RESULT 🎉⚡
  </div>

  <div
    id="resultNumber"
    class="result-number">
    #000
  </div>

  <div
    id="resultAmount"
    class="result-amount">
    ₹0
  </div>

</div>

<button
  id="nextRound"
  class="next-round"
  onclick="startNewRound()">
  🔄 NEXT ROUND
</button>

</div>

<!-- SOUNDS -->

<audio id="tickSound" preload="auto">
  <source
    src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
    type="audio/ogg">
</audio>

<audio id="electricSound" preload="auto">
  <source
    src="https://actions.google.com/sounds/v1/ambiences/electricity.ogg"
    type="audio/ogg">
</audio>

<audio id="boomSound" preload="auto">
  <source
    src="https://actions.google.com/sounds/v1/impacts/crash.ogg"
    type="audio/ogg">
</audio>

<script>

/* =========================
   SETTINGS
========================= */

const TOTAL_TICKETS = 30;
const TOTAL_AMOUNT = 200000;
const GAME_TIME = 60;

let time = GAME_TIME;
let timerInterval = null;
let gameStarted = false;
let ticketData = [];


/* =========================
   CREATE 30 TICKETS
========================= */

function createTickets(){

  const tickets =
  document.getElementById("tickets");

  tickets.innerHTML = "";

  ticketData = [];

  /*
    30 tickets में ₹2,00,000
    अलग-अलग virtual amounts
  */

  let remaining = TOTAL_AMOUNT;

  for(let i=1;i<=TOTAL_TICKETS;i++){

    let amount;

    if(i === TOTAL_TICKETS){

      amount = remaining;

    }else{

      const minRemaining =
      (TOTAL_TICKETS-i)*1000;

      const maxAllowed =
      remaining-minRemaining;

      amount =
      Math.floor(
        Math.random()*
        (maxAllowed-1000+1)
      )+1000;

    }

    remaining -= amount;

    ticketData.push({
      number:i,
      amount:amount
    });

    const ticket =
    document.createElement("div");

    ticket.className="ticket";

    ticket.innerHTML=`

      <div class="ticket-icon">
        🎟️
      </div>

      <div class="ticket-number">
        #${String(i).padStart(3,"0")}
      </div>

      <div class="ticket-amount">
        🏆 ₹${amount.toLocaleString("en-IN")}
      </div>

    `;

    tickets.appendChild(ticket);

  }

}


/* =========================
   START GAME
========================= */

function startGame(){

  if(gameStarted) return;

  gameStarted = true;

  time = GAME_TIME;

  clearInterval(timerInterval);

  document.getElementById(
    "startGame"
  ).disabled = true;

  document.getElementById(
    "timerBox"
  ).style.display = "block";

  document.getElementById(
    "winningBox"
  ).style.display = "block";

  document.getElementById(
    "status"
  ).style.display = "block";

  document.getElementById(
    "result"
  ).style.display = "none";

  document.getElementById(
    "nextRound"
  ).style.display = "none";

  /*
    Winning box countdown के दौरान खाली
  */

  document.getElementById(
    "winningNumber"
  ).innerText = "#---";

  document.getElementById(
    "winningAmount"
  ).innerText = "₹---";

  createTickets();

  document.getElementById(
    "tickets"
  ).classList.remove("hide");

  document.getElementById(
    "status"
  ).innerText =
  "🎮 सभी VIP Tickets उपलब्ध हैं — Result Countdown चल रहा है...";

  document.getElementById(
    "timer"
  ).classList.remove("warning");

  updateTimer();

  timerInterval =
  setInterval(countdown,1000);

}


/* =========================
   TIMER
========================= */

function updateTimer(){

  document.getElementById(
    "timer"
  ).innerText =
  String(time).padStart(2,"0");

}


/* =========================
   COUNTDOWN
========================= */

function countdown(){

  time--;

  updateTimer();

  playTick();

  if(time <= 10){

    document.getElementById(
      "timer"
    ).classList.add("warning");

  }

  /*
    30 सेकंड पर tickets गायब
  */

  if(time === 30){

    hideTickets();

  }

  /*
    Timer खत्म
  */

  if(time <= 0){

    clearInterval(timerInterval);

    showWinner();

  }

}


/* =========================
   HIDE TICKETS
========================= */

function hideTickets(){

  document.getElementById(
    "tickets"
  ).classList.add("hide");

  document.getElementById(
    "status"
  ).innerText =
  "🔒 TICKETS LOCKED — Final Result तैयार हो रहा है...";

}


/* =========================
   SHOW WINNER
========================= */

function showWinner(){

  /*
    30 में से एक ticket random winner
  */

  const winnerIndex =
  Math.floor(
    Math.random()*
    ticketData.length
  );

  const winner =
  ticketData[winnerIndex];

  const formatted =
  String(winner.number)
  .padStart(3,"0");

  /*
    खाली winning box में
    number + amount दिखाना
  */

  document.getElementById(
    "winningNumber"
  ).innerText =
  "#"+formatted;

  document.getElementById(
    "winningAmount"
  ).innerText =
  "₹"+
  winner.amount.toLocaleString("en-IN");

  /*
    Main result
  */

  document.getElementById(
    "resultNumber"
  ).innerText =
  "#"+formatted;

  document.getElementById(
    "resultAmount"
  ).innerText =
  "🏆 WINNING AMOUNT: ₹"+
  winner.amount.toLocaleString("en-IN");

  document.getElementById(
    "result"
  ).style.display =
  "block";

  document.getElementById(
    "status"
  ).innerText =
  "🎉 RESULT DECLARED — VIP WINNER";

  /*
    Sounds
  */

  const electric =
  document.getElementById(
    "electricSound"
  );

  electric.currentTime = 0;
  electric.volume = .8;

  electric.play().catch(()=>{});

  setTimeout(()=>{

    const boom =
    document.getElementById(
      "boomSound"
    );

    boom.currentTime = 0;
    boom.volume = .7;

    boom.play().catch(()=>{});

  },400);

  document.getElementById(
    "nextRound"
  ).style.display =
  "block";

}


/* =========================
   NEXT ROUND
========================= */

function startNewRound(){

  gameStarted = false;

  clearInterval(timerInterval);

  document.getElementById(
    "startGame"
  ).disabled = false;

  document.getElementById(
    "timerBox"
  ).style.display = "none";

  document.getElementById(
    "winningBox"
  ).style.display = "none";

  document.getElementById(
    "result"
  ).style.display = "none";

  document.getElementById(
    "nextRound"
  ).style.display = "none";

  document.getElementById(
    "tickets"
  ).classList.remove("hide");

  document.getElementById(
    "status"
  ).style.display = "none";

  time = GAME_TIME;

  updateTimer();

}


/* =========================
   TIMER SOUND
========================= */

function playTick(){

  const sound =
  document.getElementById(
    "tickSound"
  );

  sound.currentTime = 0;
  sound.volume = .25;

  sound.play().catch(()=>{});

}

</script>

</body>
  </html>
