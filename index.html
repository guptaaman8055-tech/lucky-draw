<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>VIP Premium Ticket Game</title>

<style>

/* =========================
   BASIC
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{

  min-height:100vh;

  color:white;

  background:
  radial-gradient(
    circle at top,
    #312e81,
    #080914 55%
  );

  overflow-x:hidden;

}

.container{

  max-width:900px;

  margin:auto;

  padding:15px;

}


/* =========================
   TELEGRAM
========================= */

.telegram-banner{

  display:flex;

  align-items:center;

  gap:12px;

  padding:15px;

  margin-bottom:15px;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #075985,
    #229ed9,
    #0c4a6e
  );

  border:2px solid #67e8f9;

  box-shadow:
  0 0 25px #229ed9;

}

.telegram-icon{

  font-size:32px;

}

.telegram-text{

  flex:1;

}

.join-title{

  font-size:16px;

  font-weight:bold;

}

.join-subtitle{

  font-size:10px;

  color:#e0f2fe;

  margin-top:4px;

}

.join-button{

  text-decoration:none;

  background:white;

  color:#075985;

  padding:10px 14px;

  border-radius:10px;

  font-weight:bold;

  font-size:12px;

}


/* =========================
   HEADER
========================= */

.header{

  text-align:center;

  padding:25px 15px;

  border-radius:22px;

  background:
  linear-gradient(
    135deg,
    #111827,
    #312e81,
    #581c87
  );

  box-shadow:
  0 0 35px
  rgba(124,58,237,.5);

}

.header h1{

  color:#ffd700;

  font-size:29px;

  text-shadow:
  0 0 10px gold,
  0 0 25px #f59e0b;

}

.header p{

  margin-top:8px;

  color:#cbd5e1;

}


/* =========================
   START BUTTON
========================= */

.start-game{

  display:block;

  margin:20px auto;

  padding:15px 35px;

  border:0;

  border-radius:14px;

  background:
  linear-gradient(
    135deg,
    #ffd700,
    #f59e0b
  );

  color:#111;

  font-size:18px;

  font-weight:bold;

  cursor:pointer;

  box-shadow:
  0 0 15px gold,
  0 0 35px
  rgba(255,215,0,.5);

}

.start-game:disabled{

  opacity:.5;

}


/* =========================
   TIMER + WINNER BOX
========================= */

.timer-ticket-row{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:25px;

  margin-top:20px;

}


/* =========================
   TIMER BOX
========================= */

.timer-box{

  display:none;

  flex:1;

  max-width:430px;

  text-align:center;

  padding:25px;

  border-radius:22px;

  background:
  linear-gradient(
    135deg,
    #111827,
    #172554
  );

  border:2px solid #6366f1;

  box-shadow:
  0 0 25px
  rgba(99,102,241,.5);

}

.timer-title{

  font-size:14px;

  color:#cbd5e1;

  letter-spacing:2px;

  font-weight:bold;

}


/* VIP TIMER */

.timer{

  margin-top:12px;

  font-size:72px;

  font-weight:900;

  letter-spacing:8px;

  color:white;

  padding:8px 20px;

  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    #ff004c,
    #7c3aed,
    #00eaff
  );

  background-size:300% 300%;

  animation:
  timerGradient 3s ease infinite,
  timerPulse 1s infinite alternate;

  text-shadow:
  0 0 5px white,
  0 0 15px #00eaff,
  0 0 30px #ff00cc,
  0 0 50px gold;

  box-shadow:
  0 0 15px #00eaff,
  0 0 35px #ff00cc,
  0 0 60px gold;

}


@keyframes timerGradient{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }

}


@keyframes timerPulse{

  from{

    transform:scale(1);

    filter:brightness(1);

  }

  to{

    transform:scale(1.05);

    filter:brightness(1.7);

  }

}


/* TIMER WARNING */

.timer.warning{

  animation:
  timerGradient 3s ease infinite,
  timerWarning .5s infinite alternate;

}


@keyframes timerWarning{

  from{

    transform:scale(1);

  }

  to{

    transform:scale(1.12);

    filter:brightness(2);

  }

}


/* =========================
   WINNER BOX
========================= */

.countdown-ticket{

  display:none;

  width:260px;

  min-height:220px;

  padding:20px;

  text-align:center;

  border-radius:22px;

  position:relative;

  overflow:hidden;

  background:
  linear-gradient(
    135deg,
    #1e1b4b,
    #581c87,
    #075985
  );

  border:3px solid gold;

  box-shadow:
  0 0 15px gold,
  0 0 35px #ff00cc,
  0 0 60px #00eaff;

  animation:
  countdownTicketGlow
  1s infinite alternate;

}


@keyframes countdownTicketGlow{

  from{

    transform:scale(1);

    box-shadow:
    0 0 15px gold,
    0 0 30px #ff00cc;

  }

  to{

    transform:scale(1.06);

    box-shadow:
    0 0 25px white,
    0 0 50px #00eaff,
    0 0 80px #ff00cc;

  }

}


/* COLOR LIGHT */

.countdown-ticket:before{

  content:"";

  position:absolute;

  inset:-100%;

  background:
  conic-gradient(
    transparent,
    #ff00cc,
    #00eaff,
    gold,
    transparent
  );

  animation:
  ticketRotate 2s linear infinite;

  opacity:.35;

}


@keyframes ticketRotate{

  to{

    transform:rotate(360deg);

  }

}


.countdown-ticket-content{

  position:relative;

  z-index:2;

}


/* LABEL */

.countdown-ticket-label{

  color:#fde047;

  font-size:14px;

  font-weight:bold;

  margin-top:5px;

}


/* EMPTY BOX */

.countdown-ticket-number{

  min-height:70px;

  margin-top:10px;

  font-size:52px;

  font-weight:900;

  letter-spacing:5px;

  color:white;

  text-shadow:
  0 0 10px white,
  0 0 25px #00eaff,
  0 0 45px #ff00cc,
  0 0 70px gold;

}


/* WINNING AMOUNT */

.winning-amount{

  min-height:55px;

  margin-top:15px;

  padding:10px 18px;

  border-radius:12px;

  font-size:25px;

  font-weight:bold;

  color:white;

  background:
  linear-gradient(
    90deg,
    #ff004c,
    #7c3aed,
    #00eaff,
    #00ff88,
    #ff004c
  );

  background-size:300% 100%;

  animation:
  amountGradient 2s linear infinite,
  amountPulse .7s infinite alternate;

  text-shadow:
  0 0 8px white,
  0 0 20px gold;

  box-shadow:
  0 0 15px gold,
  0 0 35px #ff00cc,
  0 0 55px #00eaff;

}


@keyframes amountGradient{

  0%{
    background-position:0% 50%;
  }

  50%{
    background-position:100% 50%;
  }

  100%{
    background-position:0% 50%;
  }

}


@keyframes amountPulse{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.08);
  }

}


/* =========================
   STATUS
========================= */

.status{

  display:none;

  text-align:center;

  margin-top:15px;

  padding:12px;

  border-radius:12px;

  background:#111827;

  color:#facc15;

}


/* =========================
   TICKETS
========================= */

.ticket-area{

  margin-top:20px;

  min-height:200px;

}


.tickets{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(145px,1fr));

  gap:14px;

}


.ticket{

  position:relative;

  padding:15px;

  text-align:center;

  border-radius:16px;

  background:
  linear-gradient(
    135deg,
    #111827,
    #312e81
  );

  border:
  1px solid
  rgba(255,215,0,.6);

  box-shadow:
  0 7px 20px
  rgba(0,0,0,.5);

  animation:
  ticketAppear .5s ease;

}


@keyframes ticketAppear{

  from{

    transform:scale(.5);

    opacity:0;

  }

  to{

    transform:scale(1);

    opacity:1;

  }

}


.ticket-top{

  display:flex;

  justify-content:space-between;

  color:#cbd5e1;

  font-size:10px;

}


.ticket-icon{

  font-size:38px;

  margin:12px 0;

}


.ticket-number{

  color:#ffd700;

  font-size:25px;

  font-weight:bold;

}


.ticket-points{

  margin-top:8px;

  color:#86efac;

  font-size:13px;

}


/* HIDE TICKETS AT 30 SEC */

.tickets.hide{

  animation:
  hideTickets .8s forwards;

}


@keyframes hideTickets{

  0%{

    opacity:1;

    transform:scale(1);

  }

  100%{

    opacity:0;

    transform:scale(.2);

    visibility:hidden;

  }

}


/* =========================
   RESULT
========================= */

.result{

  display:none;

  position:relative;

  margin-top:20px;

  padding:35px 15px 45px;

  text-align:center;

  border-radius:25px;

  overflow:hidden;

  background:
  radial-gradient(
    circle,
    #312e81,
    #111827 65%
  );

  border:3px solid gold;

  box-shadow:
  0 0 20px gold,
  0 0 50px #7c3aed,
  0 0 100px #06b6d4;

}


.result:before{

  content:"";

  position:absolute;

  inset:-50%;

  background:
  conic-gradient(
    #ff0000,
    #ffd700,
    #00ff88,
    #00eaff,
    #7c3aed,
    #ff00cc,
    #ff0000
  );

  animation:
  rotateLight 3s linear infinite;

  opacity:.25;

}


@keyframes rotateLight{

  to{

    transform:rotate(360deg);

  }

}


.result-content{

  position:relative;

  z-index:2;

}


.result-title{

  font-size:22px;

  color:#ffd700;

  margin-bottom:20px;

  text-shadow:
  0 0 10px gold,
  0 0 30px orange;

}


/* WINNER TICKET */

.winner-ticket{

  display:inline-block;

  min-width:280px;

  padding:30px 40px;

  border-radius:25px;

  background:
  linear-gradient(
    135deg,
    #1e1b4b,
    #581c87,
    #0c4a6e
  );

  border:4px solid #ffd700;

  box-shadow:
  0 0 15px #ffd700,
  0 0 35px #ff00cc,
  0 0 60px #00eaff,
  0 0 100px #7c3aed;

  animation:
  winnerBoom 1s ease,
  winnerGlow 1s infinite alternate;

}


@keyframes winnerBoom{

  0%{

    transform:
    scale(.1)
    rotate(-10deg);

    opacity:0;

  }

  60%{

    transform:
    scale(1.25)
    rotate(5deg);

  }

  100%{

    transform:
    scale(1)
    rotate(0);

    opacity:1;

  }

}


@keyframes winnerGlow{

  from{

    box-shadow:
    0 0 15px gold,
    0 0 30px #ff00cc,
    0 0 50px #00eaff;

  }

  to{

    box-shadow:
    0 0 30px white,
    0 0 60px gold,
    0 0 100px #ff00cc,
    0 0 140px #00eaff;

  }

}


.winner-icon{

  font-size:70px;

}


.winner-number{

  margin:15px 0;

  font-size:70px;

  font-weight:bold;

  color:white;

  letter-spacing:5px;

  text-shadow:
  0 0 10px white,
  0 0 25px #00eaff,
  0 0 50px #ff00cc,
  0 0 80px gold;

  animation:
  numberFlash .6s infinite alternate;

}


@keyframes numberFlash{

  from{

    filter:brightness(1);

  }

  to{

    filter:brightness(2);

  }

}


.winner-text{

  color:#fde047;

  font-size:18px;

  font-weight:bold;

}


/* RESULT AMOUNT */

.result-amount{

  margin-top:20px;

  font-size:32px;

  font-weight:bold;

  color:#fff;

  text-shadow:
  0 0 10px white,
  0 0 30px #00ff88,
  0 0 50px gold;

}


/* NEXT ROUND */

.next-round{

  display:none;

  margin:25px auto 0;

  padding:13px 25px;

  border:0;

  border-radius:12px;

  background:#22c55e;

  color:white;

  font-weight:bold;

  cursor:pointer;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .telegram-banner{

    padding:11px;

  }

  .telegram-icon{

    font-size:25px;

  }

  .join-title{

    font-size:12px;

  }

  .join-subtitle{

    font-size:8px;

  }

  .join-button{

    padding:8px;

    font-size:10px;

  }

  .header h1{

    font-size:23px;

  }

  .timer-ticket-row{

    flex-direction:column;

    gap:15px;

  }

  .timer-box{

    width:100%;

    max-width:none;

  }

  .timer{

    font-size:55px;

  }

  .countdown-ticket{

    width:90%;

  }

  .tickets{

    grid-template-columns:
    repeat(2,1fr);

  }

  .winner-ticket{

    min-width:90%;

    padding:25px 15px;

  }

  .winner-number{

    font-size:55px;

  }

}

</style>

</head>


<body>


<div class="container">

<div class="telegram-banner">

    </div>

    <div class="join-subtitle">
      Latest Updates & Entertainment
    </div>

  </div>

  <a
    href="https://t.me/+tR2_XR-9ju05M2M9"
    target="_blank"
    class="join-button">

  </a>

</div>


<!-- HEADER -->

<div class="header">

  <h1>
    🎟️ VIP PREMIUM TICKET GAME
  </h1>

    Virtual Entertainment Experience
  </p>

</div>


<!-- START -->

<button
id="startGame"
class="start-game"
onclick="startGame()">

⚡ START GAME

</button>


<!-- TIMER + WINNER BOX -->

<div class="timer-ticket-row">


<!-- TIMER -->

<div
id="timerBox"
class="timer-box">

  <div class="timer-title">
    ⚡ NEXT RESULT IN ⚡
  </div>

  <div
  id="timer"
  class="timer">

  60

  </div>

<div
id="countdownTicket"
class="countdown-ticket">

  <div
  class="countdown-ticket-content">

    <div
    class="countdown-ticket-label">

    🏆 WINNING TICKET 🏆

    </div>


    <!-- EMPTY UNTIL RESULT -->

    <div
    id="countdownTicketNumber"
    class="countdown-ticket-number">

    </div>


    <!-- EMPTY UNTIL RESULT -->

    class="winning-amount">

    </div>

  </div>

</div>

id="status"
class="status">

🎮 Game Running...

</div>

<div
class="ticket-area">

  <div
  id="tickets"
  class="tickets">

  </div>

</div>


<!-- RESULT -->

<div
id="result"
class="result">

  <div
  class="result-content">

    <div
    class="result-title">

    ⚡🎉 WINNER RESULT 🎉⚡

    </div>


    <div
    class="winner-ticket">

      <div
      class="winner-icon">

      🎟️

      </div>


      <div
      id="winnerNumber"
      class="winner-number">

      #000

      </div>


      <div
      class="winner-text">

      🏆 VIP WINNER TICKET 🏆

      </div>


      <div
      id="resultAmount"
      class="result-amount">

      </div>

    </div>

  </div>

</div>


<!-- NEXT ROUND -->

id="nextRound"

🔄 NEXT ROUND

</div>


<!-- TIMER SOUND -->

<audio
id="tickSound"

type="audio/ogg">

</audio>


<!-- ELECTRIC SOUND -->

<audio
id="electricSound"
preload="auto">

<source
src="https://actions.google.com/sounds/v1/ambiences/electricity.ogg"
type="audio/ogg">

</audio>


<!-- RESULT SOUND -->

<audio
id="boomSound"
preload="auto">

<source
src="https://actions.google.com/sounds/v1/impacts/crash.ogg"
type="audio/ogg">

</audio>


<script>


/* =========================
   VARIABLES
========================= */

let time=60;

let timerInterval=null;

let gameStarted=false;


/* =========================
   CREATE 100 TICKETS
========================= */

function createTickets(){

  const tickets =
  document.getElementById(
    "tickets"
  );

  tickets.innerHTML="";


  for(
    let i=1;
    i<=100;
    i++
  ){

    const ticket =
    document.createElement(
      "div"
    );

    ticket.className=
    "ticket";


    const number =
    String(i)
    .padStart(3,"0");


    const points =
    Math.floor(
      Math.random()*25000
    )+500;


    ticket.innerHTML=`

      <div class="ticket-top">

        <span>
        VIP
        </span>

        <span>
        2026
        </span>

      </div>

      <div class="ticket-icon">
      🎟️
      </div>

      <div class="ticket-number">
      #${number}
      </div>

      <div class="ticket-points">
      🏆 ${points.toLocaleString()} Points
      </div>

    `;


    tickets.appendChild(
      ticket
    );

  }

}


/* =========================
   START GAME
========================= */

function startGame(){

  if(gameStarted)
  return;


  gameStarted=true;


  document
  .getElementById(
    "startGame"
  )
  .disabled=true;


  document
  .getElementById(
    "timerBox"
  )
  .style.display=
  "block";


  document
  .getElementById(
    "countdownTicket"
  )
  .style.display=
  "block";


  document
  .getElementById(
    "status"
  )
  .style.display=
  "block";


  document
  .getElementById(
    "result"
  )
  .style.display=
  "none";


  document
  .getElementById(
    "nextRound"
  )
  .style.display=
  "none";


  /* CLEAR WINNER BOX */

  document
  .getElementById(
    "countdownTicketNumber"
  )
  .innerText="";


  document
  .getElementById(
    "winningAmount"
  )
  .innerText="";


  document
  .getElementById(
    "resultAmount"
  )
  .innerText="";


  /* CREATE TICKETS */

  createTickets();


  /* RESET TICKETS */

  document
  .getElementById(
    "tickets"
  )
  .classList.remove(
    "hide"
  );


  /* RESET TIMER */

  time=60;


  const timer =
  document.getElementById(
    "timer"
  );


  timer.innerText="60";


  timer.classList.remove(
    "warning"
  );


  clearInterval(
    timerInterval
  );


  timerInterval =
  setInterval(
    countdown,
    1000
  );

}


/* =========================
   COUNTDOWN
========================= */

function countdown(){

  const timer =
  document.getElementById(
    "timer"
  );


  timer.innerText =
  String(time)
  .padStart(2,"0");


  /* TIMER SOUND */

  playTick();


  /* WARNING */

  if(time<=10){

    timer.classList.add(
      "warning"
    );

  }


  /* 30 SECOND POINT */

  if(time===30){

    hideTickets();

  }


  /* TIMER FINISHED */

  if(time<=0){

    clearInterval(
      timerInterval
    );

    showWinner();

    return;

  }


  time--;

}


/* =========================
   HIDE ALL TICKETS
========================= */

function hideTickets(){

  const tickets =
  document.getElementById(
    "tickets"
  );


  tickets.classList.add(
    "hide"
  );


  document
  .getElementById(
    "status"
  )
  .innerText=
  "⚡ RESULT LOCKED — Winner is being selected...";

}


/* =========================
   SHOW WINNER
========================= */

function showWinner(){


  /* RANDOM WINNER */

  const winner =
  Math.floor(
    Math.random()*100
  )+1;


  const formatted =
  String(winner)
  .padStart(3,"0");


  /* WINNING AMOUNTS */

  const winningAmounts=[

    500,
    1000,
    2500,
    5000,
    7500,
    10000,
    12500,
    15000,
    20000,
    25000

  ];


  /* NUMBER BASED AMOUNT */

  const amountIndex =
  (winner-1)
  %
  winningAmounts.length;


  const winningAmount =
  winningAmounts[
    amountIndex
  ];


  /* WINNER NUMBER */

  document
  .getElementById(
    "countdownTicketNumber"
  )
  .innerText=
  "#"+
  formatted;


  /* WINNING AMOUNT */

  document
  .getElementById(
    "winningAmount"
  )
  .innerText=
  "🏆 WIN ₹"+
  winningAmount
  .toLocaleString(
    "en-IN"
  );


  /* MAIN RESULT */

  document
  .getElementById(
    "winnerNumber"
  )
  .innerText=
  "#"+
  formatted;


  /* RESULT AMOUNT */

  document
  .getElementById(
    "resultAmount"
  )
  .innerText=
  "💰 WIN ₹"+
  winningAmount
  .toLocaleString(
    "en-IN"
  );


  /* SHOW RESULT */

  document
  .getElementById(
    "result"
  )
  .style.display=
  "block";


  document
  .getElementById(
    "status"
  )
  .innerText=
  "🎉 RESULT DECLARED — VIP WINNER";


  /* ELECTRIC SOUND */

  const electric =
